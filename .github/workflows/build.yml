name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log (branch buildlog)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bl && cd /tmp/bl
          { echo "run=${{ github.run_number }}"; echo "outcome=${{ steps.build.outcome }}"; date -u; } > status.txt
          tail -n 400 "$GITHUB_WORKSPACE/build.log" > tail.txt || true
          grep -E "^e: |error:|FAILED|What went wrong|Caused by|Could not" "$GITHUB_WORKSPACE/build.log" | head -120 > errors.txt || true
          git init -q -b buildlog
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "build log ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" buildlog:buildlog

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SL-Zovi.apk
          gh release create "v1.0.${{ github.run_number }}" SL-Zovi.apk \
            --title "SL Zovi 1.0.${{ github.run_number }}" \
            --notes "Android aplikacija SL Zovi (build ${{ github.run_number }})" --latest
